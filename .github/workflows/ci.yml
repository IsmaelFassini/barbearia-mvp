name: CI Pipeline MVP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'

    - name: Instalar dependências
      run: npm install

    - name: Executar testes automatizados (Jest)
      run: npm test